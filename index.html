<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>再坚持一下，元旦就到了</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --accent: #ff6b6b;
      --accent-soft: #ff8787;
      --text: #e8edf4;
      --muted: #8b9cb3;
      --glow: rgba(255, 107, 107, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(ellipse at top, #1e2a3a 0%, var(--bg) 55%);
      color: var(--text);
      padding: 24px;
    }

    .container {
      width: min(720px, 100%);
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 107, 107, 0.15);
      color: var(--accent-soft);
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .holiday-name {
      font-size: clamp(2rem, 7vw, 3.2rem);
      font-weight: 700;
      background: linear-gradient(135deg, #fff 30%, var(--accent-soft));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    .holiday-range {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 36px;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 32px;
    }

    .unit {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 20px 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s;
    }

    .unit:hover { transform: translateY(-2px); }

    .value {
      font-size: clamp(2rem, 8vw, 3rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      text-shadow: 0 0 24px var(--glow);
      line-height: 1.1;
    }

    .label {
      margin-top: 6px;
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .progress-wrap {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 999px;
      height: 8px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #ffa94d);
      border-radius: 999px;
      transition: width 1s ease;
    }

    .progress-text {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    .next-list {
      text-align: left;
      background: var(--card);
      border-radius: 16px;
      padding: 20px 24px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .next-list h2 {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 14px;
      font-weight: 500;
    }

    .next-list ul { list-style: none; }

    .next-list li {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.95rem;
    }

    .next-list li:last-child { border-bottom: none; }

    .next-list li.active {
      color: var(--accent-soft);
      font-weight: 600;
    }

    .next-list .days-away {
      color: var(--muted);
      font-size: 0.85rem;
    }

    footer {
      margin-top: 28px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    @media (max-width: 480px) {
      .countdown { gap: 8px; }
      .unit { padding: 14px 4px; border-radius: 12px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">🎆 目标：2027 元旦</div>
    <h1 id="headline">再坚持一下，元旦就到了</h1>
    <div class="holiday-name" id="holidayName">2027 · 元旦</div>
    <div class="holiday-range" id="holidayRange">2027 年 1 月 1 日 00:00 · 北京时间</div>

    <div class="countdown">
      <div class="unit"><div class="value" id="days">—</div><div class="label">天</div></div>
      <div class="unit"><div class="value" id="hours">—</div><div class="label">时</div></div>
      <div class="unit"><div class="value" id="minutes">—</div><div class="label">分</div></div>
      <div class="unit"><div class="value" id="seconds">—</div><div class="label">秒</div></div>
    </div>

    <div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
    <div class="progress-text" id="progressText">—</div>

    <div class="next-list">
      <h2>给正在坚持的你</h2>
      <p style="line-height:1.9;color:var(--muted)">日子有点难熬，那就一天一天来。<br>每过一秒，都离新年更近一点。🌅</p>
    </div>

    <footer>固定倒数至 2027 年元旦零点 · 不代表具体调休安排</footer>
  </div>

  <script>
    const TARGET = new Date("2027-01-01T00:00:00+08:00").getTime();
    const START = new Date("2026-10-08T00:00:00+08:00").getTime();
    function pad(n) { return String(n).padStart(2, "0"); }
    function tick() {
      const now = Date.now();
      const diff = Math.max(0, TARGET - now);
      document.getElementById("days").textContent = pad(Math.floor(diff / 86400000));
      document.getElementById("hours").textContent = pad(Math.floor((diff % 86400000) / 3600000));
      document.getElementById("minutes").textContent = pad(Math.floor((diff % 3600000) / 60000));
      document.getElementById("seconds").textContent = pad(Math.floor((diff % 60000) / 1000));
      const pct = Math.min(100, Math.max(0, (now - START) / (TARGET - START) * 100));
      document.getElementById("progressBar").style.width = pct + "%";
      document.getElementById("progressText").textContent = diff === 0
        ? "新年快乐！你已经走到了这一天，辛苦啦 🎉"
        : `从国庆假期结束到元旦，已经走过 ${Math.floor(pct)}% · 今天也在靠近终点`;
      document.getElementById("headline").textContent = diff === 0
        ? "元旦到了，新年快乐！"
        : "再坚持一下，元旦就到了";
    }
    tick();
    setInterval(tick, 1000);
</script>
</body>
</html>
