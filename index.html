<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>距离下一个假期还有</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --accent: #ff6b6b;
      --accent-soft: #ff8787;
      --text: #e8edf4;
      --muted: #8b9cb3;
      --glow: rgba(255, 107, 107, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(ellipse at top, #1e2a3a 0%, var(--bg) 55%);
      color: var(--text);
      padding: 24px;
    }

    .container {
      width: min(720px, 100%);
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 107, 107, 0.15);
      color: var(--accent-soft);
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .holiday-name {
      font-size: clamp(2rem, 7vw, 3.2rem);
      font-weight: 700;
      background: linear-gradient(135deg, #fff 30%, var(--accent-soft));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    .holiday-range {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 36px;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 32px;
    }

    .unit {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 20px 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s;
    }

    .unit:hover { transform: translateY(-2px); }

    .value {
      font-size: clamp(2rem, 8vw, 3rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      text-shadow: 0 0 24px var(--glow);
      line-height: 1.1;
    }

    .label {
      margin-top: 6px;
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .progress-wrap {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 999px;
      height: 8px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #ffa94d);
      border-radius: 999px;
      transition: width 1s ease;
    }

    .progress-text {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    .next-list {
      text-align: left;
      background: var(--card);
      border-radius: 16px;
      padding: 20px 24px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .next-list h2 {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 14px;
      font-weight: 500;
    }

    .next-list ul { list-style: none; }

    .next-list li {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.95rem;
    }

    .next-list li:last-child { border-bottom: none; }

    .next-list li.active {
      color: var(--accent-soft);
      font-weight: 600;
    }

    .next-list .days-away {
      color: var(--muted);
      font-size: 0.85rem;
    }

    footer {
      margin-top: 28px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    @media (max-width: 480px) {
      .countdown { gap: 8px; }
      .unit { padding: 14px 4px; border-radius: 12px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">🇨🇳 法定节假日倒计时</div>
    <h1>距离下一个假期还有</h1>
    <div class="holiday-name" id="holidayName">—</div>
    <div class="holiday-range" id="holidayRange">—</div>

    <div class="countdown">
      <div class="unit"><div class="value" id="days">—</div><div class="label">天</div></div>
      <div class="unit"><div class="value" id="hours">—</div><div class="label">时</div></div>
      <div class="unit"><div class="value" id="minutes">—</div><div class="label">分</div></div>
      <div class="unit"><div class="value" id="seconds">—</div><div class="label">秒</div></div>
    </div>

    <div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
    <div class="progress-text" id="progressText">—</div>

    <div class="next-list">
      <h2>后续假期一览</h2>
      <ul id="upcomingList"></ul>
    </div>

    <footer>数据来源：国务院办公厅节假日安排 · 自动识别最近假期</footer>
  </div>

  <script>
    const HOLIDAYS = [
      { name: "元旦",   start: "2026-01-01", end: "2026-01-03", days: 3 },
      { name: "春节",   start: "2026-02-15", end: "2026-02-23", days: 9 },
      { name: "清明节", start: "2026-04-04", end: "2026-04-06", days: 3 },
      { name: "劳动节", start: "2026-05-01", end: "2026-05-05", days: 5 },
      { name: "端午节", start: "2026-06-19", end: "2026-06-21", days: 3 },
      { name: "中秋节", start: "2026-09-25", end: "2026-09-27", days: 3 },
      { name: "国庆节", start: "2026-10-01", end: "2026-10-07", days: 7 },
      { name: "元旦",   start: "2027-01-01", end: "2027-01-01", days: 1 },
      { name: "春节",   start: "2027-02-05", end: "2027-02-11", days: 7 },
      { name: "清明节", start: "2027-04-05", end: "2027-04-05", days: 1 },
      { name: "劳动节", start: "2027-05-01", end: "2027-05-02", days: 2 },
      { name: "端午节", start: "2027-06-07", end: "2027-06-09", days: 3 },
      { name: "中秋节", start: "2027-09-15", end: "2027-09-17", days: 3 },
      { name: "国庆节", start: "2027-10-01", end: "2027-10-07", days: 7 },
    ];

    function parseDate(dateStr) {
      const [y, m, d] = dateStr.split("-").map(Number);
      return new Date(y, m - 1, d, 0, 0, 0, 0);
    }

    function formatRange(h) {
      const s = h.start.replace(/-/g, ".");
      const e = h.end.replace(/-/g, ".");
      return s === e ? `${s} · 休 ${h.days} 天` : `${s} — ${e} · 休 ${h.days} 天`;
    }

    function pad(n) { return String(n).padStart(2, "0"); }

    function getNextHoliday(now) {
      for (const h of HOLIDAYS) {
        const start = parseDate(h.start);
        const end = parseDate(h.end);
        end.setHours(23, 59, 59, 999);
        if (now <= end) return { holiday: h, start, end, isDuring: now >= start };
      }
      return null;
    }

    function daysBetween(a, b) {
      return Math.ceil((b - a) / (1000 * 60 * 60 * 24));
    }

    function renderUpcoming(now, current) {
      const list = document.getElementById("upcomingList");
      list.innerHTML = "";
      const upcoming = HOLIDAYS.filter(h => parseDate(h.end) >= now).slice(0, 5);
      for (const h of upcoming) {
        const li = document.createElement("li");
        if (current && h.start === current.start && h.name === current.name) li.classList.add("active");
        const left = document.createElement("span");
        left.textContent = `${h.name} · ${formatRange(h)}`;
        const right = document.createElement("span");
        right.className = "days-away";
        const diff = daysBetween(now, parseDate(h.start));
        right.textContent = diff <= 0 && now <= parseDate(h.end) ? "进行中 🎉" : `${diff} 天后`;
        li.append(left, right);
        list.appendChild(li);
      }
    }

    function tick() {
      const now = new Date();
      const next = getNextHoliday(now);
      if (!next) return;

      const { holiday, start, end, isDuring } = next;

      document.getElementById("holidayName").textContent = isDuring ? `${holiday.name} · 假期进行中` : holiday.name;
      document.getElementById("holidayRange").textContent = formatRange(holiday);

      const target = isDuring ? end : start;
      let diff = target - now;
      if (diff < 0) diff = 0;

      document.getElementById("days").textContent = pad(Math.floor(diff / 86400000));
      document.getElementById("hours").textContent = pad(Math.floor((diff % 86400000) / 3600000));
      document.getElementById("minutes").textContent = pad(Math.floor((diff % 3600000) / 60000));
      document.getElementById("seconds").textContent = pad(Math.floor((diff % 60000) / 1000));

      const prevEnd = HOLIDAYS.filter(x => parseDate(x.end) < start).pop();
      const windowStart = prevEnd ? parseDate(prevEnd.end) : new Date(start.getFullYear(), start.getMonth() - 2, 1);
      const total = start - windowStart;
      const elapsed = now - windowStart;
      const pct = isDuring ? 100 : Math.min(100, Math.max(0, (elapsed / total) * 100));
      document.getElementById("progressBar").style.width = pct + "%";
      document.getElementById("progressText").textContent = isDuring
        ? "享受假期吧！结束后将自动切换到下一个倒计时"
        : `已等待 ${Math.round(pct)}%，坚持住！`;

      renderUpcoming(now, holiday);
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
